openapi: "3.0.3"
info:
  title: Nextcloud
  version: "32.0"
  description: >
    Nextcloud OCS v2, WebDAV, CalDAV, CardDAV, and app APIs for files, sharing,
    users, notes, calendar, Talk, activity, Deck, contacts, and more.
  x-cli-name: nextcloud
  x-env-prefix: NEXTCLOUD
servers:
  - url: "{host}"
    variables:
      host:
        default: "http://localhost"
        description: "Nextcloud base URL — set NEXTCLOUD_HOST"

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: "HTTP Basic Auth. Set NEXTCLOUD_USERNAME and NEXTCLOUD_PASSWORD."
  schemas:
    OCSMeta:
      type: object
      properties:
        status: { type: string }
        statuscode: { type: integer }
        message: { type: string }
    OCSEnvelope:
      type: object
      properties:
        ocs:
          type: object
          properties:
            meta: { $ref: "#/components/schemas/OCSMeta" }
            data: {}
    FileEntry:
      type: object
      properties:
        href: { type: string }
        name: { type: string }
        size: { type: integer }
        type: { type: string, enum: [file, directory] }
        lastmodified: { type: string, format: date-time }
        etag: { type: string }
        contenttype: { type: string }
    ShareEntry:
      type: object
      properties:
        id: { type: string }
        share_type: { type: integer }
        uid_owner: { type: string }
        displayname_owner: { type: string }
        permissions: { type: integer }
        stime: { type: integer }
        parent: {}
        expiration: { type: string }
        token: { type: string }
        uid_file_owner: { type: string }
        displayname_file_owner: { type: string }
        path: { type: string }
        item_type: { type: string }
        item_source: { type: integer }
        share_with: { type: string }
        share_with_displayname: { type: string }
        url: { type: string }
        mail_send: { type: integer }
        hide_download: { type: integer }
    UserEntry:
      type: object
      properties:
        id: { type: string }
        enabled: { type: boolean }
        email: { type: string }
        displayname: { type: string }
        quota:
          type: object
          properties:
            free: { type: integer }
            used: { type: integer }
            total: { type: integer }
            relative: { type: number }
            quota: { type: integer }
        groups: { type: array, items: { type: string } }
        subadmin: { type: array, items: { type: string } }
        language: { type: string }
        locale: { type: string }
        last_login: { type: integer }
        backend: { type: string }
        storageLocation: { type: string }
    NoteEntry:
      type: object
      properties:
        id: { type: integer }
        etag: { type: string }
        readonly: { type: boolean }
        content: { type: string }
        title: { type: string }
        category: { type: string }
        favorite: { type: boolean }
        modified: { type: integer }
        error: { type: boolean }
        errorType: { type: string }
    TalkRoom:
      type: object
      properties:
        token: { type: string }
        type: { type: integer }
        name: { type: string }
        displayName: { type: string }
        participantType: { type: integer }
        hasPassword: { type: boolean }
        hasCall: { type: boolean }
        lastActivity: { type: integer }
        unreadMessages: { type: integer }
        unreadMention: { type: boolean }
    TalkMessage:
      type: object
      properties:
        id: { type: integer }
        token: { type: string }
        actorType: { type: string }
        actorId: { type: string }
        actorDisplayName: { type: string }
        timestamp: { type: integer }
        message: { type: string }
        messageParameters: { type: object }
        systemMessage: { type: string }
        messageType: { type: string }
    ActivityEntry:
      type: object
      properties:
        activity_id: { type: integer }
        app: { type: string }
        type: { type: string }
        user: { type: string }
        subject: { type: string }
        subject_rich: {}
        message: { type: string }
        object_type: { type: string }
        object_id: { type: integer }
        object_name: { type: string }
        objects: { type: object }
        link: { type: string }
        datetime: { type: string, format: date-time }
        icon: { type: string }
    DeckBoard:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        owner:
          type: object
          properties:
            primaryKey: { type: string }
            uid: { type: string }
            displayname: { type: string }
            type: { type: integer }
        color: { type: string }
        archived: { type: boolean }
        shared: { type: integer }
        deletedAt: { type: integer }
        lastModified: { type: integer }
    DeckStack:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        boardId: { type: integer }
        order: { type: integer }
        deletedAt: { type: integer }
        cards: { type: array, items: { $ref: "#/components/schemas/DeckCard" } }
    DeckCard:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        stackId: { type: integer }
        type: { type: string }
        lastModified: { type: integer }
        lastEditor: { type: string }
        createdAt: { type: integer }
        archived: { type: boolean }
        duedate: { type: string }
        deletedAt: { type: integer }
        owner:
          type: object
          properties:
            primaryKey: { type: string }
            uid: { type: string }
            displayname: { type: string }
    SystemTag:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        userVisible: { type: boolean }
        userAssignable: { type: boolean }
        canAssign: { type: boolean }
    Capabilities:
      type: object
      properties:
        version:
          type: object
          properties:
            major: { type: integer }
            minor: { type: integer }
            micro: { type: integer }
            string: { type: string }
            edition: { type: string }
            extendedSupport: { type: boolean }
        capabilities: { type: object }

security:
  - basicAuth: []

paths:
  # ─── Capabilities / Server Info ────────────────────────────────────────────
  /ocs/v2.php/cloud/capabilities:
    get:
      operationId: getCapabilities
      summary: Get server capabilities and version
      x-cli-resource: server
      x-cli-command: info
      x-cli-description: Show server version, enabled apps, and feature capabilities
      parameters:
        - name: OCS-APIRequest
          in: header
          required: true
          schema: { type: string, default: "true" }
        - name: format
          in: query
          schema: { type: string, default: json }
      responses:
        "200":
          description: Server capabilities
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OCSEnvelope"

  # ─── Files — WebDAV ────────────────────────────────────────────────────────
  /remote.php/dav/files/{user}/{path}:
    get:
      operationId: downloadFile
      summary: Download a file
      x-cli-resource: files
      x-cli-command: download
      x-cli-description: Download a file from Nextcloud to local disk or stdout
      parameters:
        - name: user
          in: path
          required: true
          schema: { type: string }
          x-cli-env: NEXTCLOUD_USERNAME
        - name: path
          in: path
          required: true
          schema: { type: string }
          x-cli-flag: path
          description: Remote path to file (e.g. Documents/report.pdf)
      responses:
        "200":
          description: File content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
    put:
      operationId: uploadFile
      summary: Upload a file
      x-cli-resource: files
      x-cli-command: upload
      x-cli-description: Upload a local file to Nextcloud (overwrites if --overwrite)
      parameters:
        - name: user
          in: path
          required: true
          schema: { type: string }
          x-cli-env: NEXTCLOUD_USERNAME
        - name: path
          in: path
          required: true
          schema: { type: string }
          x-cli-flag: dest
          description: Remote destination path
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201": { description: File created }
        "204": { description: File updated }
    delete:
      operationId: deleteFile
      summary: Delete a file or directory
      x-cli-resource: files
      x-cli-command: delete
      x-cli-description: Delete a file or directory (use --recursive for directories)
      parameters:
        - name: user
          in: path
          required: true
          schema: { type: string }
          x-cli-env: NEXTCLOUD_USERNAME
        - name: path
          in: path
          required: true
          schema: { type: string }
          x-cli-flag: path
      responses:
        "204": { description: Deleted }

  /remote.php/dav/files/{user}:
    propfind:
      operationId: listFiles
      summary: List files and directories (WebDAV PROPFIND)
      x-cli-resource: files
      x-cli-command: list
      x-cli-description: List files in a directory (WebDAV PROPFIND); use --recursive for tree view
      parameters:
        - name: user
          in: path
          required: true
          schema: { type: string }
          x-cli-env: NEXTCLOUD_USERNAME
        - name: Depth
          in: header
          schema: { type: string, default: "1" }
          description: "1 for directory listing, infinity for recursive"
      requestBody:
        required: false
        content:
          application/xml:
            schema: { type: string }
      responses:
        "207":
          description: Multi-status file listing
          content:
            application/xml:
              schema: { type: string }

  /remote.php/dav/files/{user}/{dir}:
    mkcol:
      operationId: createDirectory
      summary: Create a directory (WebDAV MKCOL)
      x-cli-resource: files
      x-cli-command: mkdir
      x-cli-description: Create a directory on Nextcloud (use --parents for nested)
      parameters:
        - name: user
          in: path
          required: true
          schema: { type: string }
          x-cli-env: NEXTCLOUD_USERNAME
        - name: dir
          in: path
          required: true
          schema: { type: string }
          x-cli-flag: path
          description: Directory path to create
      responses:
        "201": { description: Created }

  # ─── Shares ────────────────────────────────────────────────────────────────
  /ocs/v2.php/apps/files_sharing/api/v1/shares:
    get:
      operationId: listShares
      summary: List all shares
      x-cli-resource: shares
      x-cli-command: list
      x-cli-description: List shares (optionally filter by path, share type, or shared-with-me)
      parameters:
        - name: OCS-APIRequest
          in: header
          required: true
          schema: { type: string, default: "true" }
        - name: format
          in: query
          schema: { type: string, default: json }
        - name: path
          in: query
          schema: { type: string }
          description: Filter shares for a specific path
        - name: reshares
          in: query
          schema: { type: boolean }
        - name: subfiles
          in: query
          schema: { type: boolean }
          description: Also list shares of sub-files when path is a folder
        - name: shared_with_me
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: List of shares
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OCSEnvelope"
    post:
      operationId: createShare
      summary: Create a share
      x-cli-resource: shares
      x-cli-command: create
      x-cli-description: Share a file/folder with a user, group, or public link
      parameters:
        - name: OCS-APIRequest
          in: header
          required: true
          schema: { type: string, default: "true" }
        - name: format
          in: query
          schema: { type: string, default: json }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [path, shareType]
              properties:
                path:
                  type: string
                  description: Path to the item to share
                shareType:
                  type: integer
                  description: "0=user, 1=group, 3=public link, 4=email, 6=federated, 7=circle, 10=talk"
                shareWith:
                  type: string
                  description: "User/group/email to share with (not required for public links)"
                permissions:
                  type: integer
                  description: "Permission bitmap: 1=read, 2=update, 4=create, 8=delete, 16=share, 31=all"
                password:
                  type: string
                  description: Password for public link
                expireDate:
                  type: string
                  format: date
                  description: "Expiry date (YYYY-MM-DD)"
                note:
                  type: string
                label:
                  type: string
                hideDownload:
                  type: boolean
      responses:
        "200":
          description: Share created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OCSEnvelope"

  /ocs/v2.php/apps/files_sharing/api/v1/shares/{shareId}:
    get:
      operationId: getShare
      summary: Get share details
      x-cli-resource: shares
      x-cli-command: get
      parameters:
        - name: OCS-APIRequest
          in: header
          required: true
          schema: { type: string, default: "true" }
        - name: format
          in: query
          schema: { type: string, default: json }
        - name: shareId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Share info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OCSEnvelope"
    put:
      operationId: updateShare
      summary: Update a share (permissions, expiry, password)
      x-cli-resource: shares
      x-cli-command: update
      x-cli-description: Update share permissions, expiry date, or password
      parameters:
        - name: OCS-APIRequest
          in: header
          required: true
          schema: { type: string, default: "true" }
        - name: format
          in: query
          schema: { type: string, default: json }
        - name: shareId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                permissions: { type: integer }
                password: { type: string }
                expireDate: { type: string, format: date }
                note: { type: string }
                hideDownload: { type: boolean }
      responses:
        "200":
          description: Share updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OCSEnvelope"
    delete:
      operationId: deleteShare
      summary: Delete a share
      x-cli-resource: shares
      x-cli-command: delete
      x-cli-description: Remove a share by ID
      parameters:
        - name: OCS-APIRequest
          in: header
          required: true
          schema: { type: string, default: "true" }
        - name: format
          in: query
          schema: { type: string, default: json }
        - name: shareId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Share deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OCSEnvelope"

  # ─── Users ─────────────────────────────────────────────────────────────────
  /ocs/v2.php/cloud/users:
    get:
      operationId: listUsers
      summary: List users
      x-cli-resource: users
      x-cli-command: list
      x-cli-description: List all users (admin only); use --disabled to filter inactive
      parameters:
        - name: OCS-APIRequest
          in: header
          required: true
          schema: { type: string, default: "true" }
        - name: format
          in: query
          schema: { type: string, default: json }
        - name: search
          in: query
          schema: { type: string }
          description: Search filter
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: disabled
          in: query
          schema: { type: boolean }
          description: Only return disabled users
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OCSEnvelope"
    post:
      operationId: createUser
      summary: Create a new user
      x-cli-resource: users
      x-cli-command: create
      x-cli-description: Create a new Nextcloud user (admin only)
      parameters:
        - name: OCS-APIRequest
          in: header
          required: true
          schema: { type: string, default: "true" }
        - name: format
          in: query
          schema: { type: string, default: json }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [userid]
              properties:
                userid: { type: string }
                password: { type: string }
                displayName: { type: string }
                email: { type: string }
                groups: { type: array, items: { type: string } }
                subadmin: { type: array, items: { type: string } }
                quota: { type: string }
                language: { type: string }
      responses:
        "200":
          description: User created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OCSEnvelope"

  /ocs/v2.php/cloud/users/{userId}:
    get:
      operationId: getUser
      summary: Get user details
      x-cli-resource: users
      x-cli-command: get
      x-cli-description: Get detailed user info including quota, groups, and status
      parameters:
        - name: OCS-APIRequest
          in: header
          required: true
          schema: { type: string, default: "true" }
        - name: format
          in: query
          schema: { type: string, default: json }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OCSEnvelope"
    put:
      operationId: updateUser
      summary: Update user attributes
      x-cli-resource: users
      x-cli-command: update
      x-cli-description: Update a user's display name, email, password, or quota
      parameters:
        - name: OCS-APIRequest
          in: header
          required: true
          schema: { type: string, default: "true" }
        - name: format
          in: query
          schema: { type: string, default: json }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                key:
                  type: string
                  enum: [email, displayname, password, quota, phone, address, website, twitter, locale, language]
                value: { type: string }
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OCSEnvelope"
    delete:
      operationId: deleteUser
      summary: Delete a user
      x-cli-resource: users
      x-cli-command: delete
      parameters:
        - name: OCS-APIRequest
          in: header
          required: true
          schema: { type: string, default: "true" }
        - name: format
          in: query
          schema: { type: string, default: json }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OCSEnvelope"

  /ocs/v2.php/cloud/users/{userId}/enable:
    put:
      operationId: enableUser
      summary: Enable a user
      x-cli-resource: users
      x-cli-command: enable
      parameters:
        - name: OCS-APIRequest
          in: header
          required: true
          schema: { type: string, default: "true" }
        - name: format
          in: query
          schema: { type: string, default: json }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: User enabled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OCSEnvelope"

  /ocs/v2.php/cloud/users/{userId}/disable:
    put:
      operationId: disableUser
      summary: Disable a user
      x-cli-resource: users
      x-cli-command: disable
      x-cli-description: Disable a user (admin only); they can no longer log in
      parameters:
        - name: OCS-APIRequest
          in: header
          required: true
          schema: { type: string, default: "true" }
        - name: format
          in: query
          schema: { type: string, default: json }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: User disabled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OCSEnvelope"

  /ocs/v2.php/cloud/users/{userId}/groups:
    get:
      operationId: getUserGroups
      summary: Get groups for a user
      x-cli-resource: users
      x-cli-command: groups
      parameters:
        - name: OCS-APIRequest
          in: header
          required: true
          schema: { type: string, default: "true" }
        - name: format
          in: query
          schema: { type: string, default: json }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Group list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OCSEnvelope"
    post:
      operationId: addUserToGroup
      summary: Add user to group
      x-cli-resource: users
      x-cli-command: add-group
      x-cli-description: Add a user to a group (admin only)
      parameters:
        - name: OCS-APIRequest
          in: header
          required: true
          schema: { type: string, default: "true" }
        - name: format
          in: query
          schema: { type: string, default: json }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [groupid]
              properties:
                groupid: { type: string }
      responses:
        "200":
          description: Added to group
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OCSEnvelope"

  /ocs/v2.php/cloud/users/{userId}/groups/{groupId}:
    delete:
      operationId: removeUserFromGroup
      summary: Remove user from group
      x-cli-resource: users
      x-cli-command: remove-group
      parameters:
        - name: OCS-APIRequest
          in: header
          required: true
          schema: { type: string, default: "true" }
        - name: format
          in: query
          schema: { type: string, default: json }
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: groupId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removed from group
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OCSEnvelope"

  # ─── Groups ────────────────────────────────────────────────────────────────
  /ocs/v2.php/cloud/groups:
    get:
      operationId: listGroups
      summary: List groups
      x-cli-resource: groups
      x-cli-command: list
      x-cli-description: List all groups; use --search to filter by name
      parameters:
        - name: OCS-APIRequest
          in: header
          required: true
          schema: { type: string, default: "true" }
        - name: format
          in: query
          schema: { type: string, default: json }
        - name: search
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Group list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OCSEnvelope"
    post:
      operationId: createGroup
      summary: Create a group
      x-cli-resource: groups
      x-cli-command: create
      parameters:
        - name: OCS-APIRequest
          in: header
          required: true
          schema: { type: string, default: "true" }
        - name: format
          in: query
